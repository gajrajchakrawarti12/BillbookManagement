spring:
  application:
    name: billbook-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/billbook?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:5000}
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  client-url: ${CLIENT_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-256-bit-value}
    access-expiry: ${ACCESS_TOKEN_EXPIRY:PT15M}
    refresh-expiry: ${REFRESH_TOKEN_EXPIRY:P7D}
